name: build-android

# 只在推送版本 tag 时构建并发 Release；日常提交不产生构建。
# workflow_dispatch 保留为手动触发，用于不想打 tag 时验证代码能否编译。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      # 脚手架生成在工程目录之外：仓库只存 Dart 源码，且不会被 flutter analyze 扫到。
      - name: 生成 Android 工程脚手架
        run: |
          rm -rf ../scaffold
          flutter create \
            --platforms=android \
            --org com.zlogbook \
            --project-name zlogbook \
            ../scaffold

      - name: 合并脚手架到仓库
        run: |
          mkdir -p android
          rsync -a ../scaffold/android/ android/
          ls android
          ls android/app

      - name: 应用自定义清单（禁止联网 / 应用名 Zlogbook）
        run: cp ci/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 构建 release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: 校验包内无 INTERNET 权限
        run: |
          set -e
          MANIFEST=$(find build/app/intermediates -name AndroidManifest.xml -path "*merged*" | head -1)
          echo "merged manifest: $MANIFEST"
          if [ -n "$MANIFEST" ] && grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::APK 声明了 INTERNET 权限，违反纯本地约束"
            exit 1
          fi
          echo "未声明 INTERNET 权限，检查通过"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: zlogbook-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 创建 Release 并挂上 APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
